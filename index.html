<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Criar Panfleto de Palestra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📢 Criar Panfleto</h1>
        <p class="subtitle">Preencha os campos abaixo:</p>
        
        <div class="form-card">
            <div class="input-group">
                <label for="titulo-evento">🎵 Título do Evento</label>
                <input
                    type="text"
                    id="titulo-evento"
                    value="PALESTRA"
                    placeholder="Ex: PALESTRA MUSICAL"
                    autocomplete="off"
                >
            </div>

            <div class="input-group">
                <label for="palestrante">👤 Nome do Palestrante</label>
                <input 
                    type="text" 
                    id="palestrante" 
                    placeholder="Digite o nome"
                    autocomplete="off"
                >
            </div>
            
            <div class="input-group">
                <label for="foto">📷 Foto do palestrante (opcional)</label>
                <input
                    type="file"
                    id="foto"
                    accept="image/*"
                >
                <div class="foto-preview-wrapper">
                    <img id="preview-foto" alt="Prévia da foto do palestrante" />
                </div>
            </div>
            
            <div class="input-group">
                <label for="data">📅 Data da Palestra</label>
                <input 
                    type="date" 
                    id="data" 
                    autocomplete="off"
                >
            </div>
            
            <div class="input-group">
                <label for="horario">🕐 Horário da Palestra</label>
                <input 
                    type="time" 
                    id="horario" 
                    value="19:30"
                    autocomplete="off"
                >
            </div>
            
            <button onclick="gerarPanfleto()" class="btn-gerar">
                ✨ CRIAR PANFLETO
            </button>
        </div>
        
        <div id="preview-area" class="preview-area">
            <h3>✅ Seu Panfleto:</h3>
            <canvas id="canvas" width="1080" height="1080"></canvas>
            <button onclick="baixarImagemWrapper(event)" class="btn-download">
                📤 COMPARTILHAR
            </button>
            <p class="dica">Clique para compartilhar direto no WhatsApp!</p>
        </div>
        
        <!-- Botão debug discreto fora do card -->
        <p class="debug-toggle" onclick="toggleDebug()">
            MODO DESENVOLVEDOR
        </p>
        
        <!-- Área de debug (oculta por padrão) -->
        <div id="debug-area" class="debug-area">
            <strong>📋 Log de Debug:</strong>
            <div id="debug-log"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
